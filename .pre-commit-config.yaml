# The OpenSCAP datastream is a large upstream XML file (~15 MB). It is excluded from
# the filename-based hooks below so that check-added-large-files keeps its default
# 500 KB limit for everything else, and so trailing-whitespace cannot rewrite it and
# detect-private-key cannot false-positive on the benchmark text.
exclude: ^compliance/ssg-debian12-ds\.xml$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: block-sensitive-filenames
        name: Block sensitive filenames
        entry: scripts/check-sensitive-filenames.sh
        language: script
        pass_filenames: true