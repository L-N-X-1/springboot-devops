# Deploys the app + monitoring stack to Kubernetes.
# Usage: ansible-playbook -i ansible/inventory.ini ansible/deploy.yml -e image=USER/springboot-devops -e tag=12
- name: Deploy Spring Boot app to Kubernetes
  hosts: local
  gather_facts: false
  vars:
    image: "yourdockerhubuser/springboot-devops"
    tag: "latest"
    k8s_dir: "{{ playbook_dir }}/../k8s"
    rendered: "/tmp/springboot-deployment.yaml"
    # Scanner image lives in the same Docker Hub account as the app image
    scanner_image: "{{ image.split('/')[0] }}/openscap-scanner"
    scanner_rendered: "/tmp/openscap-cronjob.yaml"

  tasks:
    - name: Check the cluster is reachable
      ansible.builtin.command: kubectl cluster-info
      changed_when: false

    - name: Create namespace
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/app/namespace.yaml
      register: ns
      changed_when: "'created' in ns.stdout or 'configured' in ns.stdout"

    - name: Render deployment with image {{ image }}:{{ tag }}
      ansible.builtin.template:
        src: "{{ k8s_dir }}/app/deployment.yaml.j2"
        dest: "{{ rendered }}"
        mode: "0644"

    - name: Apply app deployment and service
      ansible.builtin.command: kubectl apply -f {{ rendered }} -f {{ k8s_dir }}/app/service.yaml
      register: app
      changed_when: "'created' in app.stdout or 'configured' in app.stdout"

    - name: Create monitoring namespace
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/monitoring/00-namespace.yaml
      register: monns
      changed_when: "'created' in monns.stdout or 'configured' in monns.stdout"

    - name: Create Grafana admin secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: grafana-admin
            namespace: monitoring
          type: Opaque
          stringData:
            admin-password: "{{ vault_grafana_admin_password }}"
      no_log: true

    - name: Apply monitoring stack (Prometheus + Grafana)
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/monitoring/
      register: mon
      changed_when: "'created' in mon.stdout or 'configured' in mon.stdout"

    - name: Wait for the rollout to finish
      ansible.builtin.command: kubectl rollout status deployment/springboot-app -n devops --timeout=300s
      changed_when: false

    - name: Render OpenSCAP CronJob with image {{ scanner_image }}:{{ tag }}
      ansible.builtin.template:
        src: "{{ k8s_dir }}/compliance/cronjob.yaml.j2"
        dest: "{{ scanner_rendered }}"
        mode: "0644"
      vars:
        openscap_image: "{{ scanner_image }}:{{ tag }}"

    - name: Apply OpenSCAP CronJob (compliance namespace + nightly node scan)
      ansible.builtin.command: kubectl apply -f {{ scanner_rendered }}
      register: oscap
      changed_when: "'created' in oscap.stdout or 'configured' in oscap.stdout"

    - name: Show running pods
      ansible.builtin.command: kubectl get pods -n devops -o wide
      register: pods
      changed_when: false

    - name: Pods
      ansible.builtin.debug:
        var: pods.stdout_lines