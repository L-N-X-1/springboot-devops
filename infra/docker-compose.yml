# Local CI/CD stack: Jenkins + SonarQube + Nexus
# Start Minikube FIRST (Jenkins joins the "minikube" Docker network to reach the cluster).
services:
  jenkins:
    build: ./jenkins
    container_name: jenkins
    user: root                      # needed to use the host Docker socket (local lab only)
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: /casc/jenkins.yaml
      KUBECONFIG: /kube/config
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jenkins/casc.yaml:/casc/jenkins.yaml:ro,z
      - ./jenkins/kubeconfig:/kube/config:ro,z
    networks: [devops, minikube]
    depends_on: [sonarqube, nexus]

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks: [devops]

  nexus:
    image: sonatype/nexus3
    container_name: nexus
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - nexus_data:/nexus-data
    networks: [devops]

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  nexus_data:

networks:
  devops:
  minikube:
    external: true    # created by "minikube start --driver=docker"
